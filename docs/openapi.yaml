openapi: 3.0.3

info:
  title: Adyen Checkout API
  version: "72.0"
  description: >
    The Adyen Checkout API provides a modern and flexible way to accept
    payments online. This documentation covers the Drop-in integration
    for web, including authentication, payment sessions, and error handling.
  contact:
    name: Adyen Developer Support
    url: https://docs.adyen.com
    email: support@adyen.com

servers:
  - url: https://checkout-test.adyen.com/v72
    description: Test environment
  - url: https://checkout-live.adyen.com/v72
    description: Live environment

tags:
  - name: Sessions
    description: Create and manage payment sessions
  - name: Payments
    description: Submit and manage payments
  - name: Payment Methods
    description: Retrieve available payment methods
  - name: Modifications
    description: Capture, cancel, or refund payments

    paths:
    /sessions:
     post:
      tags:
        - Sessions
      summary: Create a payment session
      description: >
        Creates a payment session that initializes the Drop-in component.
        The session contains all the information needed to render the 
        payment form and process the transaction.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchantAccount
                - amount
                - currency
                - returnUrl
              properties:
                merchantAccount:
                  type: string
                  description: Your Adyen merchant account name.
                  example: YourMerchantAccount
                amount:
                  type: integer
                  description: >
                    Payment amount in minor units. For example, 
                    1000 represents $10.00 in USD.
                  example: 1000
                currency:
                  type: string
                  description: The three-letter ISO 4217 currency code.
                  example: USD
                returnUrl:
                  type: string
                  description: >
                    The URL to redirect the shopper to after payment 
                    is completed.
                  example: https://yoursite.com/checkout/complete
      responses:
        "201":
          description: Session created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique session identifier.
                    example: CS-Adyen-1234567890
                  sessionData:
                    type: string
                    description: >
                      Encrypted session data passed to the 
                      Drop-in component.
                    example: Ab02b4c...
                  expiresAt:
                    type: string
                    description: Session expiry time in ISO 8601 format.
                    example: "2024-01-15T12:00:00Z"
        "400":
          description: Bad request. Missing or invalid parameters.
        "401":
          description: Unauthorized. Invalid or missing API key.
        "422":
          description: Unprocessable entity. Invalid merchant account.

    /paymentMethods:
     post:
      tags:
        - Payment Methods
      summary: Get available payment methods
      description: >
        Returns the payment methods available for a specific shopper
        in a given country and currency. Use this endpoint to determine
        which payment options to display before initializing Drop-in.
      operationId: getPaymentMethods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchantAccount
                - countryCode
                - amount
                - currency
              properties:
                merchantAccount:
                  type: string
                  description: Your Adyen merchant account name.
                  example: YourMerchantAccount
                countryCode:
                  type: string
                  description: >
                    The shopper's country code in ISO 3166-1 alpha-2 
                    format. This determines which payment methods 
                    are available.
                  example: US
                amount:
                  type: integer
                  description: >
                    Payment amount in minor units. For example,
                    1000 represents $10.00 in USD.
                  example: 1000
                currency:
                  type: string
                  description: The three-letter ISO 4217 currency code.
                  example: USD
                shopperLocale:
                  type: string
                  description: >
                    The language and country combination used to 
                    display payment method names. Defaults to en-US.
                  example: en-US
      responses:
        "200":
          description: Available payment methods retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentMethods:
                    type: array
                    description: List of available payment methods.
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The payment method type identifier.
                          example: scheme
                        name:
                          type: string
                          description: The display name of the payment method.
                          example: Credit Card
        "400":
          description: Bad request. Missing or invalid parameters.
        "401":
          description: Unauthorized. Invalid or missing API key.